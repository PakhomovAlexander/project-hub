name = "architecture"
version = "1.3.0"
subjects = ["whole-tree"]

# Opus at maximum reasoning — set the model and effort your project wants reviews run at.
# The prompt is reviewer.md, composed by the adapter; everything in this package is under the
# lock's content digest, prompt included.
[runner]
program = "codex"
args = [
  { value = "--model" },
  { value = "gpt-5.6-sol" },
  { value = "-c" },
  { value = 'model_reasoning_effort="high"' },
]
