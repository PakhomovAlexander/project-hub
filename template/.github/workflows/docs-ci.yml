name: docs CI

# TEMPLATE: this workflow keeps the hub honest on every PR — markdownlint
# (config in .markdownlint-cli2.jsonc), an OFFLINE relative-link check that catches
# stale doc paths, and the Review Kernel gate (fmt/clippy/tests/fixtures) behind
# /self-review-heavy. Generic as-is; delete the kernel job if you dropped the skill,
# and the whole file if the hub isn't on GitHub.

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".markdownlint-cli2.jsonc"
      - ".github/workflows/docs-ci.yml"
      - ".claude/workflows/**"
      - "tests/**"
      - "tools/review-kernel/**"
      - ".review/**"
      - ".agents/skills/self-review-heavy/scripts/**"
      - "Makefile"
      - "tools/review-kernel/**"
      - ".review/**"
      - ".agents/skills/self-review-heavy/scripts/**"
      - "Makefile"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".markdownlint-cli2.jsonc"
      - ".github/workflows/docs-ci.yml"
      - ".claude/workflows/**"
      - "tests/**"

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  review-kernel:
    name: review kernel (fmt, clippy, tests, fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Pinned in tools/review-kernel/rust-toolchain.toml; installed explicitly so a
      # missing component fails here rather than mid-job.
      - name: Install the pinned toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt
      - name: fmt
        run: make review-kernel-fmt
      - name: clippy
        run: make review-kernel-lint
      # Includes the contract acceptance tests. The private legacy corpus is absent in a
      # fresh hub; those tests skip with a notice until the hub freezes its own bundles.
      - name: tests
        run: make review-kernel-test
      # The synthetic fixtures are generated by running the legacy shell harness. This
      # regenerates them here and diffs, which also proves the corpus is not macOS-only.
      - name: fixtures reproduce
        run: make review-kernel-fixtures
      # The malicious-check.md probes that need real isolation, against the runner's
      # live Docker daemon. #[ignore]d in the ordinary test run; here a missing daemon is
      # a hard failure, never a skip — an unrun probe must not look like a passed one.
      - name: container probes (live daemon)
        run: make review-kernel-container-probes

  markdownlint:
    name: markdownlint (light, high-signal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      # Pinned for reproducibility; config is .markdownlint-cli2.jsonc.
      - name: markdownlint-cli2
        run: npx --yes markdownlint-cli2@0.22.1 "**/*.md"

  links:
    name: link check (internal, offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # --offline checks relative/file links only (catches stale doc paths) and
      # skips remote URLs. Many hub links point at private repos / internal hosts /
      # placeholders that aren't verifiable unauthenticated, so we don't fetch them.
      - name: lychee (relative-link integrity)
        uses: lycheeverse/lychee-action@82202e5e9c2f4ef1a55a3d02563e1cb6041e5332 # v2.4.1
        with:
          args: --offline --no-progress "./**/*.md"
          fail: true

  workflow-tests:
    name: workflow smoke tests (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: run tests/smoke-*.mjs
        shell: bash
        run: |
          shopt -s nullglob
          found=0
          for smoke_test in tests/smoke-*.mjs; do
            found=1
            echo "== $smoke_test"
            node "$smoke_test"
          done
          if [ "$found" -eq 0 ]; then
            echo "no tests/smoke-*.mjs found"
          fi
